services:
  frontend:
    build:
      context: ./client
      target: development
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/bun.lock
        - action: rebuild
          path: ./client/vite.config.ts
        - action: rebuild
          path: ./client/tsconfig.json
        - action: rebuild
          path: ./client/tsr.config.json

  backend:
    env_file:
      - .env
    build: ./server
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./server/src
        - action: rebuild
          path: ./server/pom.xml
